---
 - name: error handling
   hosts: local
   connection: local
   tasks:
   - name: check the user
     ansible.builtin.command: id roboshop
     register: id_user
     ignore_errors: true

   - name: print output
     ansible.builtin.debug:
      msg: "{{ id_user }}"  

   - name: create user
     ansible.builtin.command: useradd roboshop
     when: id_user.rc != 0   