---
 - name: data types demo
   hosts: local
   connection: local
   vars:
    PROGRAM: "java"
    DURATION: "45 days"
    IS_LIVE: true
    DETAILS:
     MONTHS: 4
     TRAINER: shiva
    TOPICS:
     - ansible
     - linux
     - shell
    tasks:
    - name: print variables
    ansible.builtin.debug:
    msg: |
    program: {{PROGRAM}}  
    duration: {{DURATION}}
    is live: {{IS_LIVE}}
    details: {{DETAILS}}
    topics: {{TOPICS}}
