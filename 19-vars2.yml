---
 - name: play level variables
   hosts: local
   connection: local
   vars:
    course: "devops"
    duration: "45 days"
    trainer: "veerendra"
   tasks: 
    - name: print level variables
      vars:
       course: ansible
       duration: "45 days"
       ansible.builtin.debug:
        msg: "course is: {{course}}, duration is {{duration}}"