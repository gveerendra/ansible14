---
 - name: demo on filters
   hosts: local
   connection: local
   vars: 
    topics: linux, shell, ansible, terraform
    course: "devops with ansible"
    tagsmap: 
     name: ansible
     project: roboshop
     component: catologue
    tagslist: [
      {
        "key": "name",
        "value": "ansible"
      },
      {
        "project": "project",
        "value": "roboshop"
      },
      {
        "key": "component",
        "value": "catologue"
      }
    
    ] 

   tasks:
   - name: greeting
     ansible.builtin.debug:
      msg: "hi shiva {{ GREETING | default('good morning')}}" 
   - name: convert string to list
     ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"

   - name: convert lower to upper
     ansible.builtin.debug:
      msg: "{{ course | upper }}"

   - name: convert upper to lower
     ansible.builtin.debug:
      msg: "{{ course | lower }}"  

   - name: convert map to list
     ansible.builtin.debug:
      msg: "{{ tagsmap | items2dict }}"   

   - name: convert list to map
     ansible.builtin.debug:
      msg: "{{ tagslist | items2dict }}"    